name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = Apple Silicon, macos-15-intel = Intel.
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build macOS voice helper
        if: runner.os == 'macOS'
        run: npm run build:voice
      - name: Install the packed CLI like a user would
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g "$RUNNER_TEMP"/jarvis-dev-orchestrator-*.tgz
          jarvis --version
          jarvis --help
